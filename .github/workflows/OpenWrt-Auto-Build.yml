name: OpenWrt-Auto-Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt upgrade -y

          sudo apt install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man \
            intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp \
            nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            python3-jsonschema qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Clone OpenWrt
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt

          sed -i '$a src-git smpackage https://github.com/kenzok8/small-package' feeds.conf.default

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Replace dae and LuCI packages
        working-directory: openwrt
        run: |
          set -eu

          # 拉取已在本地验证过的包仓库，保留 Linux 符号链接及文件权限
          DAE_PACKAGE_DIR="$RUNNER_TEMP/dae-packages"
          git clone --depth 1 --branch main \
            https://github.com/az4399/luci-app-dae.git "$DAE_PACKAGE_DIR"

          # 确认两个包完整存在后，再替换 feeds 安装的包入口
          test -f "$DAE_PACKAGE_DIR/dae/Makefile"
          test -f "$DAE_PACKAGE_DIR/luci-app-dae/Makefile"

          rm -rf package/feeds/smpackage/dae
          rm -rf package/feeds/smpackage/luci-app-dae
          cp -a "$DAE_PACKAGE_DIR/dae" package/feeds/smpackage/dae
          cp -a "$DAE_PACKAGE_DIR/luci-app-dae" package/feeds/smpackage/luci-app-dae

          # 输出实际使用的提交、dae 版本、源码地址及 LuCI 依赖，便于核对
          git -C "$DAE_PACKAGE_DIR" log -1 --format='%H %s'
          grep -E '^(PKG_VERSION|PKG_SOURCE_URL|PKG_SOURCE_URL_FILE|PKG_HASH):=' \
            package/feeds/smpackage/dae/Makefile
          grep '^LUCI_DEPENDS:=' package/feeds/smpackage/luci-app-dae/Makefile

      - name: Configure OpenWrt
        working-directory: openwrt
        run: |
          # 使用仓库根目录的 .config
          cp "$GITHUB_WORKSPACE/.config" .config

          # 设置时区为 Asia/Shanghai
          sed -i "s/set system.@system\['-1'\]\.timezone='UTC'/set system.@system['-1'].timezone='CST-8'/g" \
            package/base-files/files/bin/config_generate

          sed -i "/set system.@system\['-1'\]\.timezone='CST-8'/a \\
          \t\tset system.@system['-1'].zonename='Asia/Shanghai'" \
            package/base-files/files/bin/config_generate

          # 设置 NTP 服务器
          sed -i "s#0.openwrt.pool.ntp.org#ntp.aliyun.com#; \
          s#1.openwrt.pool.ntp.org#ntp1.aliyun.com#; \
          s#2.openwrt.pool.ntp.org#ntp2.aliyun.com#; \
          s#3.openwrt.pool.ntp.org#time1.cloud.tencent.com#" \
            package/base-files/files/bin/config_generate

          # dae / eBPF / BTF
          cat << 'EOF' >> .config
          CONFIG_DEVEL=y
          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_REDUCED=n
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_CGROUPS=y
          CONFIG_KERNEL_CGROUP_BPF=y
          CONFIG_KERNEL_BPF_EVENTS=y
          CONFIG_KERNEL_XDP_SOCKETS=y
          CONFIG_BPF_TOOLCHAIN_HOST=y
          CONFIG_PACKAGE_kmod-xdp-sockets-diag=y
          EOF

          # 自动开启 Netkit
          grep -q '^CONFIG_NETKIT=y$' target/linux/rockchip/armv8/config-6.18 || \
            echo 'CONFIG_NETKIT=y' >> target/linux/rockchip/armv8/config-6.18

          # dae 使用 v2ray geo 数据包
          sed -i 's/+dae-geoip +dae-geosite/+v2ray-geoip +v2ray-geosite/' \
            package/feeds/smpackage/luci-app-dae/Makefile

          make defconfig

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j$(nproc)

      - name: Build OpenWrt
        working-directory: openwrt
        run: |
          make -j$(nproc)

      - name: Upload firmware to Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: daed-build-${{ github.run_number }}
          name: DAED OpenWrt Build ${{ github.run_number }}
          files: |
            openwrt/bin/targets/rockchip/armv8/*.gz
            openwrt/bin/targets/rockchip/armv8/sha256sums
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
